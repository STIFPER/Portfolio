<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Wachirawit - Portfolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@300;400;500;600;700;800&family=Playfair+Display:ital@1&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
      };
    </script>

    <style>
      :root {
        --bg: #f4f4f5;
        --text: #18181b;
        --font-main: "Manrope", sans-serif;
        --font-mono: "IBM Plex Mono", monospace;
        --font-serif: "Playfair Display", serif;
        --folder-w: min(calc(100vw - 64px), 320px);
      }

      .dark {
        --bg: #09090b;
        --text: #fafafa;
      }

      body {
        background-color: var(--bg);
        color: var(--text);
        font-family: var(--font-main);
        margin: 0;
        overflow-x: hidden;
      }

      /* --- FULL SCREEN HERO SECTION --- */
      .scroll-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        overflow: hidden;
      }

      .sticky-scene {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
      }

      /* --- Infinite Carousel Wrapper --- */
      .carousel-wrapper {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        touch-action: pan-y;
        cursor: grab;
        z-index: 5;
        overflow: hidden;
        contain: strict;
        transform: translateZ(0);
      }
      .carousel-wrapper:active {
        cursor: grabbing;
      }

      .folder-stage {
        position: absolute;
        top: 54%;
        left: 50%;
        width: 0;
        height: 0;
        perspective: 800px;
      }

      .folder-card {
        position: absolute;
        width: var(--folder-w);
        height: 270px;
        left: 0;
        top: 0;
        margin-left: calc(var(--folder-w) / -2);
        margin-top: -135px;
        transform-origin: center center;
        will-change: transform, opacity;
        contain: layout style;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }

      .folder-card:not(.is-active) {
        pointer-events: none;
      }

      .folder-back {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border-radius: 24px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      }

      .folder-tab {
        position: absolute;
        top: -30px;
        left: 0;
        height: 50px;
        width: 120px;
        background-color: inherit;
        border-radius: 16px 16px 0 0;
        clip-path: polygon(0 0, 80% 0, 100% 100%, 0 100%);
        padding: 8px 0 0 16px;
        font-family: var(--font-mono);
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .folder-front {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 16px 16px 24px 24px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        padding: 24px;
        display: flex;
        flex-direction: column;
        z-index: 3;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }

      /* --- Lightbox --- */
      .lightbox-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .lightbox-overlay.active {
        opacity: 1;
        pointer-events: auto;
      }

      .lightbox-content {
        transform: scale(0.95) translateY(20px);
        opacity: 0;
        transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .active .lightbox-content {
        transform: scale(1) translateY(0);
        opacity: 1;
      }

      /* แก้ไข: ลบ max-height ออก เพื่อให้รูปแสดงเต็มความยาวตามสัดส่วนจริง */
      #lightboxImage {
        width: 100%;
        height: auto;
        display: block;
        /* ปล่อยให้ยาวเต็มที่ ไม่โดนครอป */
      }

      /* Custom Scrollbar for Lightbox */
      .custom-scrollbar::-webkit-scrollbar {
        width: 8px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: rgba(156, 163, 175, 0.4);
        border-radius: 20px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background-color: rgba(156, 163, 175, 0.7);
      }

      .hero-element {
        opacity: 0;
        transform: translateY(20px);
        animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes fadeUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes swipeHint {
        0%,
        100% {
          transform: translateX(0);
        }
        50% {
          transform: translateX(5px);
        }
      }
      .animate-swipe {
        display: inline-block;
        animation: swipeHint 1.5s infinite ease-in-out;
      }
    </style>
  </head>
  <body>
    <!-- Theme Toggle -->
    <button
      id="themeToggle"
      class="fixed top-6 right-6 z-50 w-12 h-12 rounded-full bg-white/80 dark:bg-zinc-900/80 backdrop-blur-md border border-gray-200 dark:border-zinc-800 flex items-center justify-center shadow-lg"
    >
      <svg
        class="dark:block hidden w-5 h-5 text-yellow-400"
        fill="currentColor"
        viewBox="0 0 20 20"
      >
        <path
          d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"
        ></path>
      </svg>
      <svg
        class="dark:hidden block w-5 h-5 text-zinc-800"
        fill="currentColor"
        viewBox="0 0 20 20"
      >
        <path
          d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"
        ></path>
      </svg>
    </button>

    <!-- 1. FULL SCREEN HERO SECTION -->
    <div class="scroll-container" id="scrollHero">
      <div class="sticky-scene">
        <!-- Header Hero -->
        <div
          class="absolute top-12 w-full text-center z-10 pointer-events-none hero-element"
        >
          <p
            class="font-mono text-[11px] opacity-40 uppercase tracking-[0.2em] mb-2"
          >
            Project Stack
          </p>
          <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight">
            Wachirawit.
          </h1>
        </div>

        <!-- Carousel Area -->
        <div class="carousel-wrapper" id="carouselWrapper">
          <div class="folder-stage" id="folderStage">
            <!-- JS injects cards here -->
          </div>
        </div>

        <!-- Hint -->
        <div
          class="absolute bottom-10 font-mono text-[10px] opacity-40 tracking-[0.2em] text-center w-full z-10 pointer-events-none transition-opacity duration-300"
          id="scrollHint"
        >
          <div class="mb-2"><span class="animate-swipe text-lg">→</span></div>
          SWIPE TO EXPLORE
        </div>
      </div>
    </div>

    <!-- Static Content -->
    <section
      class="bg-white dark:bg-zinc-900 py-24 px-6 border-t border-black/5 dark:border-white/5 relative z-20"
    >
      <div class="max-w-4xl mx-auto text-center">
        <h3 class="text-3xl font-extrabold mb-12">The Archive</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 text-left">
          <div
            class="p-8 rounded-3xl border border-zinc-200 dark:border-zinc-800"
          >
            <h4 class="text-xl font-bold mb-2">Design Strategy</h4>
            <p class="opacity-60 text-sm">
              Approaching problems with a systematic mindset to create scalable
              solutions.
            </p>
          </div>
          <div
            class="p-8 rounded-3xl border border-zinc-200 dark:border-zinc-800"
          >
            <h4 class="text-xl font-bold mb-2">Visual Craft</h4>
            <p class="opacity-60 text-sm">
              Obsessing over details, typography, and spacing to deliver premium
              feel.
            </p>
          </div>
        </div>
      </div>
    </section>

    <!-- Lightbox -->
    <div id="lightboxOverlay" class="lightbox-overlay" onclick="closeProject()">
      <div
        class="lightbox-content w-[95vw] max-w-[800px] h-[90vh] bg-white dark:bg-zinc-900 rounded-[2rem] relative shadow-2xl flex flex-col overflow-hidden"
        onclick="event.stopPropagation()"
      >
        <!-- ปุ่มกากบาท -->
        <button
          onclick="closeProject()"
          class="absolute top-4 right-4 z-20 w-10 h-10 flex items-center justify-center rounded-full bg-black/40 backdrop-blur-md text-white hover:bg-black/70 transition-colors shadow-lg"
          aria-label="Close"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>

        <!-- พื้นที่ Scrollable -->
        <div class="overflow-y-auto custom-scrollbar w-full h-full relative">
          <!-- Image: ตอนนี้จะแสดงผลเต็มสัดส่วน ไม่โดนครอป -->
          <img
            id="lightboxImage"
            src=""
            alt="Project Presentation"
            loading="lazy"
            decoding="async"
            class="bg-zinc-100 dark:bg-zinc-800"
          />

          <!-- เนื้อหาคำอธิบายด้านล่างรูปภาพ -->
          <div
            class="bg-white dark:bg-zinc-900 relative z-10 p-8 sm:p-10 flex flex-col"
          >
            <div class="mb-3">
              <span
                id="lightboxCat"
                class="font-mono text-[11px] font-bold text-zinc-500 dark:text-zinc-400 uppercase tracking-widest"
              ></span>
            </div>
            <h3 id="lightboxTitle" class="text-3xl font-extrabold mb-4"></h3>
            <p
              id="lightboxDesc"
              class="text-zinc-600 dark:text-zinc-300 mb-8 leading-relaxed text-sm sm:text-base"
            ></p>

            <a
              id="lightboxLink"
              href="#"
              target="_blank"
              class="w-full sm:w-auto inline-flex justify-center items-center gap-2 px-6 py-3.5 bg-zinc-900 dark:bg-white text-white dark:text-zinc-900 rounded-xl font-bold transition-transform hover:scale-[1.02] active:scale-95 text-sm"
            >
              View Full Project
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"
                ></path>
                <polyline points="15 3 21 3 21 9"></polyline>
                <line x1="10" y1="14" x2="21" y2="3"></line>
              </svg>
            </a>
          </div>
        </div>
      </div>
    </div>

    <script>
      // 1. เพิ่ม property "image" ลงใน Data เพื่อให้แต่ละโปรเจกต์ดึงรูปไปใช้ไม่ซ้ำกัน
      // คุณสามารถเปลี่ยน URL ตรงนี้เป็น 'images/project1.jpg' ของคุณได้เลยครับ
      const projects = [
        {
          id: 1,
          cat: "Research",
          title: "Eco Habit",
          color: "#D5D5D0",
          role: "Lead UX",
          tech: "Figma",
          desc: "A mobile application designed to encourage sustainable living habits. The project focused heavily on user research to understand behavioral triggers for eco-friendly actions.",
          link: "#",
          image: "images/project1.jpg", // <- เปลี่ยนเป็นรูปของคุณ
        },
        {
          id: 2,
          cat: "Visual",
          title: "Neo-Bank",
          color: "#C4CEDB",
          role: "UI Design",
          tech: "Principle",
          desc: "A conceptual redesign for a modern digital bank, focusing on micro-interactions, dark mode aesthetics, and an intuitive transaction flow.",
          link: "#",
          image:
            "https://images.unsplash.com/photo-1563986768494-4dee2763ff3f?auto=format&fit=crop&w=800&q=80",
        },
        {
          id: 3,
          cat: "System",
          title: "Lumina OS",
          color: "#D0C8B6",
          role: "Product",
          tech: "SwiftUI",
          desc: "A scalable design system created for an enterprise software suite. It includes over 200 components with strict accessibility guidelines.",
          link: "#",
          image:
            "https://images.unsplash.com/photo-1558655146-d09347e92766?auto=format&fit=crop&w=800&q=80",
        },
        {
          id: 4,
          cat: "Branding",
          title: "Origami",
          color: "#BFC5B8",
          role: "Brand Lead",
          tech: "Illustrator",
          desc: "Comprehensive brand identity for an innovative logistics startup, featuring dynamic logo generation, color psychology, and typography rules.",
          link: "#",
          image:
            "https://images.unsplash.com/photo-1626785774573-4b799315345d?auto=format&fit=crop&w=800&q=80",
        },
        {
          id: 5,
          cat: "Medical",
          title: "Sync 360",
          color: "#CDBBB7",
          role: "UX Strategy",
          tech: "React",
          desc: "A healthcare dashboard aimed at bridging communication between doctors and patients, streamlining medical records access securely.",
          link: "#",
          image:
            "https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=800&q=80",
        },
        {
          id: 6,
          cat: "Fintech",
          title: "CoinVault",
          color: "#C2C3CE",
          role: "UI/UX",
          tech: "Framer",
          desc: "An intuitive cryptocurrency wallet interface with a focus on simplifying complex trading data into easy-to-read, actionable charts.",
          link: "#",
          image:
            "https://images.unsplash.com/photo-1639762681485-074b7f4ec651?auto=format&fit=crop&w=800&q=80",
        },
      ];

      const stage = document.getElementById("folderStage");
      const wrapper = document.getElementById("carouselWrapper");
      const N = projects.length;

      let targetProgress = 0.001;
      let currentProgress = 0;
      let isDragging = false;
      let startX = 0;
      let startProgress = 0;
      let isLightboxOpen = false;
      let rafId = null;
      let isLoopRunning = false;

      function startLoop() {
        if (isLoopRunning) return;
        isLoopRunning = true;
        rafId = requestAnimationFrame(renderLoop);
      }

      function initFolders() {
        stage.innerHTML = "";
        projects.forEach((proj, i) => {
          const card = document.createElement("div");
          card.className = "folder-card";

          card.innerHTML = `
            <div class="folder-back" style="background-color: ${proj.color}">
              <div class="folder-tab" style="color: #18181b;">${proj.cat}</div>
            </div>
            <div class="folder-front" style="background-color: ${proj.color}; color: #18181b;">
              <div class="mb-4">
                <span class="font-mono text-[10px] opacity-60 font-bold uppercase tracking-widest">Project 0${i + 1}</span>
                <h2 class="text-3xl font-extrabold tracking-tight mt-1 leading-none">${proj.title}</h2>
              </div>
              <div class="grid grid-cols-2 gap-4 mb-4 mt-auto border-t border-black/10 pt-4">
                <div><span class="text-[10px] font-mono opacity-60 uppercase block mb-1">Role</span><p class="font-bold text-xs">${proj.role}</p></div>
                <div><span class="text-[10px] font-mono opacity-60 uppercase block mb-1">Tools</span><p class="font-bold text-xs">${proj.tech}</p></div>
              </div>
              <button onclick="openProject(${i})" class="w-full h-12 rounded-xl font-bold text-[11px] uppercase tracking-widest transition-transform hover:scale-[1.02] active:scale-95 bg-black/5 hover:bg-black/10 flex items-center justify-center gap-2">
                Preview
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
              </button>
            </div>
          `;
          stage.appendChild(card);
        });
        startLoop();
      }

      const spacing = window.innerWidth < 768 ? 160 : 250;

      function renderLoop() {
        const diff_prog = targetProgress - currentProgress;
        if (!isDragging && Math.abs(diff_prog) < 0.0005) {
          currentProgress = targetProgress;
          isLoopRunning = false;
          updateCards();
          return;
        }
        currentProgress += diff_prog * 0.1;
        updateCards();
        rafId = requestAnimationFrame(renderLoop);
      }

      function updateCards() {
        const cards = document.querySelectorAll(".folder-card");
        cards.forEach((card, i) => {
          let diff = (((i - currentProgress) % N) + N) % N;
          if (diff > N / 2) diff -= N;
          const isActive = Math.abs(diff) < 0.5;
          if (isActive) card.classList.add("is-active");
          else card.classList.remove("is-active");

          const x = diff * spacing;
          const z = Math.abs(diff) * -120;
          const rotateY = diff * -45;
          const scale = Math.max(0.7, 1 - Math.abs(diff) * 0.1);
          const opacity = Math.max(0, 1 - Math.abs(diff) * 0.4);
          const zIndex = 100 - Math.round(Math.abs(diff) * 10);

          card.style.transform = `translateX(${x}px) translateZ(${z}px) rotateY(${rotateY}deg) scale(${scale})`;
          card.style.zIndex = zIndex;
          card.style.opacity = opacity;
          card.style.pointerEvents = isActive ? "auto" : "none";
        });

        const hint = document.getElementById("scrollHint");
        if (hint && Math.abs(currentProgress) > 0.1) {
          hint.style.opacity = "0";
        }
      }

      function handleDragStart(e) {
        if (isLightboxOpen) return;
        isDragging = true;
        startX = e.type.includes("mouse") ? e.pageX : e.touches[0].pageX;
        startProgress = targetProgress;
        startLoop();
      }

      function handleDragMove(e) {
        if (!isDragging) return;
        const currentX = e.type.includes("mouse")
          ? e.pageX
          : e.touches[0].pageX;
        const diffX = currentX - startX;
        targetProgress = startProgress - diffX / 250;
      }

      function handleDragEnd() {
        if (!isDragging) return;
        isDragging = false;
        targetProgress = Math.round(targetProgress);
      }

      wrapper.addEventListener("mousedown", handleDragStart);
      window.addEventListener("mousemove", handleDragMove);
      window.addEventListener("mouseup", handleDragEnd);
      window.addEventListener("mouseleave", handleDragEnd);
      wrapper.addEventListener("touchstart", handleDragStart, {
        passive: true,
      });
      window.addEventListener("touchmove", handleDragMove, { passive: true });
      window.addEventListener("touchend", handleDragEnd);

      let wheelTimeout;
      wrapper.addEventListener(
        "wheel",
        (e) => {
          if (isLightboxOpen) return;
          if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
            e.preventDefault();
            targetProgress += e.deltaX * 0.005;
            startLoop();
            clearTimeout(wheelTimeout);
            wheelTimeout = setTimeout(() => {
              targetProgress = Math.round(targetProgress);
            }, 150);
          }
        },
        { passive: false },
      );

      function openProject(i) {
        isLightboxOpen = true;
        const proj = projects[i];

        // 3. เปลี่ยนจากดึงรูป placeholder มาดึงค่าจาก proj.image ใน Data
        document.getElementById("lightboxImage").src = proj.image;

        document.getElementById("lightboxCat").textContent = proj.cat;
        document.getElementById("lightboxTitle").textContent = proj.title;
        document.getElementById("lightboxDesc").textContent = proj.desc;
        document.getElementById("lightboxLink").href = proj.link;
        document.getElementById("lightboxOverlay").classList.add("active");
      }

      function closeProject() {
        isLightboxOpen = false;
        document.getElementById("lightboxOverlay").classList.remove("active");
        setTimeout(() => {
          document.getElementById("lightboxImage").src = "";
        }, 400);
      }

      const themeToggleBtn = document.getElementById("themeToggle");
      const htmlElement = document.documentElement;

      if (
        localStorage.theme === "dark" ||
        (!("theme" in localStorage) &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        htmlElement.classList.add("dark");
      } else {
        htmlElement.classList.remove("dark");
      }

      themeToggleBtn.addEventListener("click", () => {
        htmlElement.classList.toggle("dark");
        localStorage.theme = htmlElement.classList.contains("dark")
          ? "dark"
          : "light";
      });

      window.onload = initFolders;
    </script>
  </body>
</html>
