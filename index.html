<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Wachirawit - Portfolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@300;400;500;600;700;800&family=Playfair+Display:ital@1&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
      };
    </script>

    <style>
            :root {
              --bg: #f4f4f5;
              --text: #18181b;
              --font-main: "Manrope", sans-serif;
              --font-mono: "IBM Plex Mono", monospace;
              --font-serif: "Playfair Display", serif;
              --folder-w: min(
                calc(100vw - 64px),
                320px
              ); /* ปรับความกว้างนิดหน่อยให้พอดีกับการหัน 45 องศา */
              --folder-front-bg: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.95) 0%,
                rgba(255, 250, 240, 0.8) 50%,
                rgba(255, 255, 255, 0.4) 100%
              );
              --folder-front-border: rgba(255, 255, 255, 0.9);
            }

            .dark {
              --bg: #09090b;
              --text: #fafafa;
              --folder-front-bg: linear-gradient(
                135deg,
                rgba(39, 39, 42, 0.95) 0%,
                rgba(24, 24, 27, 0.8) 50%,
                rgba(9, 9, 11, 0.6) 100%
              );
              --folder-front-border: rgba(255, 255, 255, 0.05);
            }

            body {
              background-color: var(--bg);
              color: var(--text);
              font-family: var(--font-main);
              margin: 0;
              overflow-x: hidden;
            }

            /* --- FULL SCREEN HERO SECTION --- */
            .scroll-container {
              position: relative;
              width: 100vw;
              height: 100vh; /* ให้ Hero เต็มหน้าจอพอดี */
              display: flex;
              flex-direction: column;
              justify-content: center;
              overflow: hidden;
            }

            .sticky-scene {
              position: relative;
              width: 100%;
              height: 100%;
              display: flex;
              align-items: center;
            }

            /* --- Infinite Carousel Wrapper --- */
            .carousel-wrapper {
              position: absolute;
              top: 0;
              left: 0;
              width: 100%;
              height: 100%;
              touch-action: pan-y; /* ยอมให้เลื่อนขึ้นลงเพื่ออ่าน Content ข้างล่างได้ แต่ดักจับการปัดซ้ายขวา */
              cursor: grab;
              z-index: 5;
              overflow: hidden;
            }
            .carousel-wrapper:active {
              cursor: grabbing;
            }

            .folder-stage {
              position: absolute;
              top: 54%; /* ขยับลงมานิดนึงเพื่อหลบ Header */
              left: 50%;
              width: 0;
              height: 0; /* เป็นจุดศูนย์กลางของจักรวาล 3D */
              perspective: 800px; /* เพิ่มมิติ 3D ให้การหัน 45 องศาดูสมจริง */
            }

            .folder-card {
              position: absolute;
              width: var(--folder-w);
              height: 270px; /* ย่อความสูงลงเพราะเอาคำบรรยาย (Desc) ออกแล้ว */
              left: 0;
              top: 0;
              margin-left: calc(var(--folder-w) / -2);
              margin-top: -135px;
              transform-origin: center center;
            will-change: transform, opacity;
      }

            .folder-card:not(.is-active) {
              pointer-events: none; /* กันยูสเซอร์กดใบที่เบลออยู่ */
            }

            .folder-back {
              position: absolute;
              top: 0;
              left: 0;
              width: 100%;
              height: 100%;
              border-radius: 24px;
              box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            }

            .folder-tab {
              position: absolute;
              top: -30px; /* ติ่งด้านบน */
              left: 0;
              height: 50px;
              width: 120px;
              background-color: inherit;
              border-radius: 16px 16px 0 0;
              clip-path: polygon(0 0, 80% 0, 100% 100%, 0 100%);
              padding: 8px 0 0 16px;
              font-family: var(--font-mono);
              font-size: 10px;
              font-weight: 700;
              text-transform: uppercase;
              letter-spacing: 1px;
            }

          .folder-front {
          position: relative;
           width: 100%;
          height: 100%;
           /* ปรับสีพื้นหลังให้ทึบขึ้นอีกนิด เพื่อให้อ่านง่ายโดยไม่ต้องใช้ Blur */
          background: rgba(255, 255, 255, 0.95);
          border-radius: 16px 16px 24px 24px;
          border: 1px solid rgba(255, 255, 255, 0.3);
          padding: 24px;
          display: flex;
          flex-direction: column;
          z-index: 3;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);

            /* --- Lightbox --- */
            .lightbox-overlay {
              position: fixed;
              top: 0;
              left: 0;
              width: 100vw;
              height: 100vh;
              background: rgba(0, 0, 0, 0.85);
              z-index: 9999;
              display: flex;
              justify-content: center;
              align-items: center;
              opacity: 0;
              pointer-events: none;
              transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            }
            .lightbox-overlay.active {
              opacity: 1;
              pointer-events: auto;
            }

            .lightbox-content {
              width: 90vw;
              max-width: 400px;
              background: #fff;
              border-radius: 32px;
              overflow: hidden;
              transform: scale(0.9);
              transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            }
            .active .lightbox-content {
              transform: scale(1);
            }

            .hero-element {
              opacity: 0;
              transform: translateY(20px);
              animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            }
            @keyframes fadeUp {
              to {
                opacity: 1;
                transform: translateY(0);
              }
            }

            /* Animation for swipe hint */
            @keyframes swipeHint {
              0%,
              100% {
                transform: translateX(0);
              }
              50% {
                transform: translateX(5px);
              }
            }
            .animate-swipe {
              display: inline-block;
              animation: swipeHint 1.5s infinite ease-in-out;
            }
    </style>
  </head>
  <body>
    <!-- Theme Toggle -->
    <button
      id="themeToggle"
      class="fixed top-6 right-6 z-50 w-12 h-12 rounded-full bg-white/80 dark:bg-zinc-900/80 backdrop-blur-md border border-gray-200 dark:border-zinc-800 flex items-center justify-center shadow-lg"
    >
      <svg
        class="dark:block hidden w-5 h-5 text-yellow-400"
        fill="currentColor"
        viewBox="0 0 20 20"
      >
        <path
          d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"
        ></path>
      </svg>
      <svg
        class="dark:hidden block w-5 h-5 text-zinc-800"
        fill="currentColor"
        viewBox="0 0 20 20"
      >
        <path
          d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"
        ></path>
      </svg>
    </button>

    <!-- 1. FULL SCREEN HERO SECTION (WITH INFINITE CAROUSEL) -->
    <div class="scroll-container" id="scrollHero">
      <div class="sticky-scene">
        <!-- Header Hero (Wachirawit) -->
        <div
          class="absolute top-12 w-full text-center z-10 pointer-events-none hero-element"
        >
          <p
            class="font-mono text-[11px] opacity-40 uppercase tracking-[0.2em] mb-2"
          >
            Project Stack
          </p>
          <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight">
            Wachirawit.
          </h1>
        </div>

        <!-- Carousel Area -->
        <div class="carousel-wrapper" id="carouselWrapper">
          <div class="folder-stage" id="folderStage">
            <!-- JS injects cards here -->
          </div>
        </div>

        <!-- Hint ด้านล่าง -->
        <div
          class="absolute bottom-10 font-mono text-[10px] opacity-40 tracking-[0.2em] text-center w-full z-10 pointer-events-none transition-opacity duration-300"
          id="scrollHint"
        >
          <div class="mb-2"><span class="animate-swipe text-lg">→</span></div>
          SWIPE TO EXPLORE
        </div>
      </div>
    </div>

    <!-- Static Content -->
    <section
      class="bg-white dark:bg-zinc-900 py-24 px-6 border-t border-black/5 dark:border-white/5 relative z-20"
    >
      <div class="max-w-4xl mx-auto text-center">
        <h3 class="text-3xl font-extrabold mb-12">The Archive</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 text-left">
          <div
            class="p-8 rounded-3xl border border-zinc-200 dark:border-zinc-800"
          >
            <h4 class="text-xl font-bold mb-2">Design Strategy</h4>
            <p class="opacity-60 text-sm">
              Approaching problems with a systematic mindset to create scalable
              solutions.
            </p>
          </div>
          <div
            class="p-8 rounded-3xl border border-zinc-200 dark:border-zinc-800"
          >
            <h4 class="text-xl font-bold mb-2">Visual Craft</h4>
            <p class="opacity-60 text-sm">
              Obsessing over details, typography, and spacing to deliver premium
              feel.
            </p>
          </div>
        </div>
      </div>
    </section>

    <!-- Lightbox -->
    <div id="lightboxOverlay" class="lightbox-overlay" onclick="closeProject()">
      <div class="lightbox-content" onclick="event.stopPropagation()">
        <img
          id="lightboxImage"
          class="w-full aspect-[3/4] object-cover"
          src=""
          alt=""
        />
        <div class="p-8 dark:bg-zinc-900 bg-white text-center">
          <h3 id="lightboxTitle" class="text-2xl font-bold mb-6"></h3>
          <button
            onclick="closeProject()"
            class="w-full py-4 bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-900 rounded-2xl font-bold"
          >
            Close Preview
          </button>
        </div>
      </div>
    </div>

    <script>
      const projects = [
        {
          id: 1,
          cat: "Research",
          title: "Eco Habit",
          color: "#E8F5E9",
          role: "Lead UX",
          tech: "Figma",
        },
        {
          id: 2,
          cat: "Visual",
          title: "Neo-Bank",
          color: "#F3E5F5",
          role: "UI Design",
          tech: "Principle",
        },
        {
          id: 3,
          cat: "System",
          title: "Lumina OS",
          color: "#FFF3E0",
          role: "Product",
          tech: "SwiftUI",
        },
        {
          id: 4,
          cat: "Branding",
          title: "Origami",
          color: "#E1F5FE",
          role: "Brand Lead",
          tech: "Illustrator",
        },
        {
          id: 5,
          cat: "Medical",
          title: "Sync 360",
          color: "#FBE9E7",
          role: "UX Strategy",
          tech: "React",
        },
        {
          id: 6,
          cat: "Fintech",
          title: "CoinVault",
          color: "#E0F7FA",
          role: "UI/UX",
          tech: "Framer",
        },
      ];

      const stage = document.getElementById("folderStage");
      const wrapper = document.getElementById("carouselWrapper");
      const N = projects.length;

      // ตัวแปรสำหรับฟิสิกส์การสไลด์แบบไร้จุดจบ (Infinite Loop)
      let targetProgress = 0.001;
      let currentProgress = 0;
      let isDragging = false;
      let startX = 0;
      let startProgress = 0;
      let isLightboxOpen = false;

      function initFolders() {
        stage.innerHTML = "";
        projects.forEach((proj, i) => {
          const card = document.createElement("div");
          card.className = "folder-card";

          const btnBg = "var(--text)";
          const btnText = "var(--bg)";

          // โครงสร้างใหม่ที่เอา Desc ออก และดันปุ่มลงไปติดขอบล่าง
          card.innerHTML = `
            <div class="folder-back" style="background-color: ${proj.color}">
              <div class="folder-tab">${proj.cat}</div>
            </div>
            <div class="folder-front">
              
              <div class="mb-4">
                <span class="font-mono text-[10px] opacity-40 font-bold uppercase tracking-widest">Project 0${i + 1}</span>
                <h2 class="text-3xl font-extrabold tracking-tight mt-1 leading-none">${proj.title}</h2>
              </div>
              
              <!-- ข้อมูล Role/Tools ตรงกลาง -->
              <div class="grid grid-cols-2 gap-4 mb-4 mt-auto border-t border-black/5 dark:border-white/5 pt-4">
                <div><span class="text-[10px] font-mono opacity-40 uppercase block mb-1">Role</span><p class="font-bold text-xs">${proj.role}</p></div>
                <div><span class="text-[10px] font-mono opacity-40 uppercase block mb-1">Tools</span><p class="font-bold text-xs">${proj.tech}</p></div>
              </div>

              <!-- ปุ่ม Preview ด้านล่างสุด -->
              <button onclick="openProject(${i})" class="w-full h-12 rounded-xl font-bold text-[11px] uppercase tracking-widest transition-transform active:scale-95 shadow-md flex items-center justify-center gap-2" style="background-color: ${btnBg}; color: ${btnText}">
                Preview
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
              </button>
            </div>
          `;
          stage.appendChild(card);
        });

        requestAnimationFrame(renderLoop);
      }
      // ระยะห่างระหว่างไพ่ (Spacing)
      const spacing = window.innerWidth < 768 ? 160 : 250;

      // ฟังก์ชันหัวใจสำคัญ: จัดการ 3D Cover Flow แบบ Infinite
      function renderLoop() {
        // ใช้ Lerp (Linear Interpolation) ให้การเลื่อนสมูท
        currentProgress += (targetProgress - currentProgress) * 0.1;

        const cards = document.querySelectorAll(".folder-card");
        cards.forEach((card, i) => {
          // คำนวณความต่างแบบลูป (Modulo Math)
          // เช่น ถ้าเราอยู่ที่ใบที่ 1 (index 0) ใบที่ 6 (index 5) จะถูกคำนวณให้ไปอยู่ด้านซ้ายสุดแบบติดลบ (-1)
          let diff = (((i - currentProgress) % N) + N) % N;
          if (diff > N / 2) diff -= N;

          const isActive = Math.abs(diff) < 0.5;
          if (isActive) card.classList.add("is-active");
          else card.classList.remove("is-active");

          // Physics - การหัน 45 องศา (Cover Flow)
          const x = diff * spacing;
          const z = Math.abs(diff) * -120; // ดันใบที่ไม่ได้เลือกไปข้างหลัง

          // นี่คือจุดเด่นที่คุณเปอร์ชอบ: เอียงการ์ด 45 องศา (หันหน้าเข้าหาตรงกลาง)
          const rotateY = diff * -45;

          const scale = Math.max(0.7, 1 - Math.abs(diff) * 0.1);
          const opacity = Math.max(0, 1 - Math.abs(diff) * 0.4);
          const zIndex = 100 - Math.round(Math.abs(diff) * 10);

          card.style.transform = `translateX(${x}px) translateZ(${z}px) rotateY(${rotateY}deg) scale(${scale})`;
          card.style.zIndex = zIndex;
          card.style.opacity = opacity;

          // บังคับให้การ์ดรอบข้างกดไม่ได้ ป้องกันการลั่น
          card.style.pointerEvents = isActive ? "auto" : "none";
        });

        // ซ่อน Hint เมื่อเริ่มปัด
        const hint = document.getElementById("scrollHint");
        if (hint && Math.abs(currentProgress) > 0.1) {
          hint.style.opacity = "0";
        }

        requestAnimationFrame(renderLoop);
      }

      // --- ระบบจับการปัด (Drag & Swipe) ---
      function handleDragStart(e) {
        if (isLightboxOpen) return;
        isDragging = true;
        startX = e.type.includes("mouse") ? e.pageX : e.touches[0].pageX;
        startProgress = targetProgress;
      }

      function handleDragMove(e) {
        if (!isDragging) return;
        const currentX = e.type.includes("mouse")
          ? e.pageX
          : e.touches[0].pageX;
        const diffX = currentX - startX;
        // ปรับตัวเลขหาร (250) เพื่อความหนืด/ไว ในการลากนิ้ว
        targetProgress = startProgress - diffX / 250;
      }

      function handleDragEnd() {
        if (!isDragging) return;
        isDragging = false;
        // ดีดตัวกลับ (Snap) ให้ลงล็อกตำแหน่งแบบเป๊ะๆ 1, 2, 3...
        targetProgress = Math.round(targetProgress);
      }

      // รองรับเมาส์บน Desktop (คลิกแล้วลาก)
      wrapper.addEventListener("mousedown", handleDragStart);
      window.addEventListener("mousemove", handleDragMove);
      window.addEventListener("mouseup", handleDragEnd);
      window.addEventListener("mouseleave", handleDragEnd);

      // รองรับการทัชบนมือถือ (ปัดหน้าจอ)
      wrapper.addEventListener("touchstart", handleDragStart, {
        passive: true,
      });
      window.addEventListener("touchmove", handleDragMove, { passive: true });
      window.addEventListener("touchend", handleDragEnd);

      // --- อัปเดตใหม่: รองรับ Apple Mouse / Trackpad (Wheel / Scroll แนวนอน) ---
      let wheelTimeout;
      wrapper.addEventListener(
        "wheel",
        (e) => {
          if (isLightboxOpen) return;

          // เช็คว่าผู้ใช้กำลังไถ "แนวนอน" (deltaX) มากกว่า "แนวตั้ง" (deltaY)
          if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
            e.preventDefault(); // ป้องกันเบราว์เซอร์เปลี่ยนหน้า (Back/Forward swipe)

            // ปรับความไวของการไถ Trackpad (เพิ่ม/ลด 0.005 ได้ตามความชอบ)
            targetProgress += e.deltaX * 0.005;

            // เมื่อหยุดไถ Trackpad เป็นเวลา 150ms ให้ดีดตัว (Snap) เข้าล็อกการ์ดที่ใกล้ที่สุด
            clearTimeout(wheelTimeout);
            wheelTimeout = setTimeout(() => {
              targetProgress = Math.round(targetProgress);
            }, 150);
          }
        },
        { passive: false },
      );

      // --- Lightbox Logic ---
      function openProject(i) {
        isLightboxOpen = true;
        const proj = projects[i];
        const hexColor = proj.color.replace("#", "");
        const safeTitle = proj.title.replace(/\s+/g, "+");

        document.getElementById("lightboxImage").src =
          `https://placehold.co/600x800/${hexColor}/18181B?text=${safeTitle}+3:4`;
        document.getElementById("lightboxTitle").textContent = proj.title;
        document.getElementById("lightboxOverlay").classList.add("active");
      }

      function closeProject() {
        isLightboxOpen = false;
        document.getElementById("lightboxOverlay").classList.remove("active");
      }

      // Theme Toggle Logic
      const themeToggleBtn = document.getElementById("themeToggle");
      const htmlElement = document.documentElement;

      if (
        localStorage.theme === "dark" ||
        (!("theme" in localStorage) &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        htmlElement.classList.add("dark");
      } else {
        htmlElement.classList.remove("dark");
      }

      themeToggleBtn.addEventListener("click", () => {
        htmlElement.classList.toggle("dark");
        localStorage.theme = htmlElement.classList.contains("dark")
          ? "dark"
          : "light";
      });

      window.onload = initFolders;
    </script>
  </body>
</html>
